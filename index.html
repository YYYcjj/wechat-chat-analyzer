<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信聊天记录分析</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f0f2f5; color:#333; min-height:100vh; }
.header { background:linear-gradient(135deg,#07c160,#06ae56); color:#fff; padding:24px 32px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.1); }
.header h1 { font-size:28px; font-weight:600; }
.header p { opacity:.85; margin-top:6px; font-size:14px; }

.container { max-width:1400px; margin:0 auto; padding:24px; }
.upload-zone { border:3px dashed #c0c4cc; border-radius:16px; padding:60px 40px; text-align:center; cursor:pointer; transition:all .3s; background:#fff; margin-bottom:24px; }
.upload-zone:hover, .upload-zone.dragover { border-color:#07c160; background:#f0faf4; }
.upload-zone .icon { font-size:56px; margin-bottom:16px; }
.upload-zone h3 { font-size:20px; color:#333; margin-bottom:8px; }
.upload-zone p { color:#999; font-size:14px; }
.upload-zone .formats { margin-top:16px; font-size:12px; color:#bbb; }
.upload-zone input[type=file] { display:none; }

.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.stat-card .label { font-size:13px; color:#999; margin-bottom:8px; }
.stat-card .value { font-size:32px; font-weight:700; color:#07c160; }
.stat-card .sub { font-size:12px; color:#bbb; margin-top:4px; }

.charts-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
@media(max-width:900px) { .charts-row{grid-template-columns:1fr;} }
.chart-card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.chart-card h3 { font-size:16px; margin-bottom:16px; color:#333; display:flex; align-items:center; gap:8px; }
.chart-card canvas { max-height:320px; }

.full-width { grid-column:1/-1; }

.message-viewer { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.06); margin-bottom:24px; }
.message-viewer h3 { font-size:16px; margin-bottom:16px; }
.search-bar { display:flex; gap:8px; margin-bottom:16px; }
.search-bar input { flex:1; padding:10px 16px; border:1px solid #e0e0e0; border-radius:8px; font-size:14px; outline:none; }
.search-bar input:focus { border-color:#07c160; }
.search-bar select { padding:10px 16px; border:1px solid #e0e0e0; border-radius:8px; font-size:14px; outline:none; background:#fff; }
.search-bar .date-input { padding:10px 12px; border:1px solid #e0e0e0; border-radius:8px; font-size:13px; outline:none; color:#666; width:130px; }
.search-bar .date-input:focus { border-color:#07c160; }
.msg-list { max-height:500px; overflow-y:auto; }
.msg-item { padding:12px 16px; border-bottom:1px solid #f5f5f5; display:flex; gap:12px; align-items:flex-start; }
.msg-item:hover { background:#fafafa; }
.msg-time { font-size:12px; color:#999; white-space:nowrap; min-width:70px; }
.msg-sender { font-size:13px; font-weight:600; color:#07c160; min-width:80px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.msg-content { font-size:14px; color:#333; flex:1; word-break:break-all; line-height:1.5; }

.export-bar { text-align:center; margin-bottom:24px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.btn { padding:10px 24px; border-radius:8px; font-size:14px; border:none; cursor:pointer; font-weight:500; transition:all .2s; }
.btn-primary { background:#07c160; color:#fff; }
.btn-primary:hover { background:#06ae56; }
.btn-outline { background:#fff; color:#07c160; border:1px solid #07c160; }
.btn-outline:hover { background:#f0faf4; }
.btn-accent { background:#576b95; color:#fff; }
.btn-accent:hover { background:#4a5d82; }
.btn-warn { background:#f5a623; color:#fff; }
.btn-warn:hover { background:#e09510; }

.empty-state { text-align:center; padding:60px 20px; color:#bbb; }
.empty-state .big-icon { font-size:72px; margin-bottom:16px; }

/* Word Cloud */
.word-cloud-canvas { width:100%; border-radius:8px; background:#fafbfc; }

/* Sentiment */
.sentiment-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px; }
.sentiment-card { text-align:center; padding:20px; border-radius:12px; }
.sentiment-card .s-label { font-size:13px; margin-bottom:4px; }
.sentiment-card .s-value { font-size:28px; font-weight:700; }
.sentiment-card .s-pct { font-size:12px; opacity:.7; margin-top:4px; }
.sentiment-positive { background:#f0faf4; color:#07c160; }
.sentiment-neutral { background:#f5f7fa; color:#576b95; }
.sentiment-negative { background:#fff5f5; color:#e74c3c; }

.sentiment-person-row { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid #f5f5f5; }
.sentiment-person-name { min-width:80px; font-size:13px; font-weight:500; }
.sentiment-bar-wrap { flex:1; height:20px; background:#f0f0f0; border-radius:10px; overflow:hidden; display:flex; }
.sentiment-bar-pos { background:#07c160; transition:width .5s; }
.sentiment-bar-neu { background:#c0c4cc; transition:width .5s; }
.sentiment-bar-neg { background:#e74c3c; transition:width .5s; }
.sentiment-person-score { font-size:12px; color:#999; min-width:50px; text-align:right; }

.emoji-list { display:flex; flex-wrap:wrap; gap:12px; }
.emoji-item { font-size:24px; padding:8px 12px; background:#fafafa; border-radius:8px; display:flex; align-items:center; gap:8px; }
.emoji-item .ec { font-size:12px; color:#999; }

/* Personality */
.personality-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.person-card { background:#fafbfc; border-radius:12px; padding:20px; border:1px solid #f0f0f0; }
.person-card .p-name { font-size:16px; font-weight:600; margin-bottom:12px; color:#333; }
.person-card .p-metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.person-card .p-metric { font-size:12px; color:#666; }
.person-card .p-metric .mv { font-weight:600; color:#07c160; }
.person-tags { display:flex; flex-wrap:wrap; gap:6px; }
.person-tag { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:500; }
.person-tag.active { background:#e6f7ee; color:#07c160; }
.person-tag.thought { background:#eef2ff; color:#576b95; }
.person-tag.fun { background:#fff7e6; color:#f5a623; }
.person-tag.warm { background:#fff0f6; color:#e91e63; }
.person-tag.night { background:#f3e8ff; color:#9b59b6; }
.person-tag.direct { background:#e6f3ff; color:#3498db; }

/* Relationship */
.rel-metrics { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.rel-card { background:#fafbfc; border-radius:10px; padding:14px; text-align:center; }
.rel-card .r-label { font-size:12px; color:#999; margin-bottom:4px; }
.rel-card .r-value { font-size:22px; font-weight:700; color:#07c160; }
.rel-card .r-sub { font-size:11px; color:#bbb; }
.rel-bar { display:flex; align-items:center; gap:8px; margin:8px 0; }
.rel-bar-label { font-size:12px; color:#666; min-width:60px; }
.rel-bar-track { flex:1; height:16px; background:#f0f0f0; border-radius:8px; overflow:hidden; display:flex; }
.rel-bar-fill { height:100%; }
.rel-bar-value { font-size:12px; color:#999; min-width:35px; text-align:right; }

.footer { text-align:center; padding:32px; color:#bbb; font-size:12px; }
</style>
</head>
<body>
<div class="header">
  <h1>📊 微信聊天记录分析</h1>
  <p>上传聊天记录导出文件，一键生成可视化分析报告</p>
</div>

<div class="container">
  <div id="uploadSection">
    <div class="upload-zone" id="uploadZone">
      <div class="icon">📁</div>
      <h3>点击上传或拖拽文件到此处</h3>
      <p>支持微信PC版/手机版导出的 .txt 文件</p>
      <p class="formats">支持格式：微信导出txt · 纯文本 · CSV</p>
      <input type="file" id="fileInput" accept=".txt,.csv,.text">
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="export-bar">
      <button class="btn btn-primary" onclick="exportReport()">📄 导出分析报告</button>
      <button class="btn btn-outline" onclick="location.reload()">🔄 重新上传</button>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="charts-row">
      <div class="chart-card">
        <h3>😊 情感分析总览</h3>
        <div class="sentiment-grid" id="sentimentOverview"></div>
        <div id="sentimentPersonList"></div>
      </div>
      <div class="chart-card">
        <h3>☁️ 高频词云</h3>
        <canvas id="wordCloud" class="word-cloud-canvas" width="600" height="400"></canvas>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <h3>📈 每日消息趋势</h3>
        <canvas id="dailyChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>👥 发言人数分布</h3>
        <canvas id="personChart"></canvas>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <h3>🕐 24小时活跃时段</h3>
        <canvas id="hourlyChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>📅 每周活跃分布</h3>
        <canvas id="weeklyChart"></canvas>
      </div>
    </div>

    <div class="chart-card full-width">
      <h3>🎭 人物画像</h3>
      <div class="personality-grid" id="personalityGrid"></div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <h3>📊 情感变化趋势</h3>
        <canvas id="sentimentTrend"></canvas>
      </div>
      <div class="chart-card">
        <h3>💞 互动关系分析</h3>
        <div id="relationshipAnalysis"></div>
      </div>
    </div>

    <div class="chart-card full-width" style="margin-bottom:24px;">
      <h3>😀 常用表情/Emoji</h3>
      <div class="emoji-list" id="emojiList"></div>
    </div>

    <div class="chart-card full-width">
      <h3>👤 个人详细统计</h3>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:14px;" id="personTable">
          <thead>
            <tr style="background:#fafafa;">
              <th style="padding:12px;text-align:left;border-bottom:1px solid #eee;">发言人</th>
              <th style="padding:12px;text-align:right;border-bottom:1px solid #eee;">消息数</th>
              <th style="padding:12px;text-align:right;border-bottom:1px solid #eee;">占比</th>
              <th style="padding:12px;text-align:right;border-bottom:1px solid #eee;">平均长度</th>
              <th style="padding:12px;text-align:right;border-bottom:1px solid #eee;">😊情感</th>
              <th style="padding:12px;text-align:right;border-bottom:1px solid #eee;">图片/文件</th>
              <th style="padding:12px;text-align:right;border-bottom:1px solid #eee;">首条时间</th>
              <th style="padding:12px;text-align:right;border-bottom:1px solid #eee;">末条时间</th>
            </tr>
          </thead>
          <tbody id="personTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="message-viewer">
      <h3>💬 消息记录</h3>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索消息内容...">
        <input type="date" id="dateFrom" class="date-input" title="开始日期">
        <input type="date" id="dateTo" class="date-input" title="结束日期">
        <select id="personFilter"><option value="">全部发言人</option></select>
      </div>
      <div class="msg-list" id="msgList"></div>
    </div>
  </div>
</div>

<div class="footer">数据仅在本地浏览器中处理，不会上传到任何服务器</div>

<script>
let allMessages = [];
let charts = {};
let globalStats = null;

// ==================== FILE UPLOAD ====================
const zone = document.getElementById('uploadZone');
const input = document.getElementById('fileInput');

zone.addEventListener('click', () => input.click());
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });
input.addEventListener('change', e => handleFile(e.target.files[0]));

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    parseWeChat(text);
    document.getElementById('uploadSection').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  };
  reader.readAsText(file, 'UTF-8');
}

// ==================== PARSER ====================
function parseWeChat(text) {
  allMessages = [];
  const lines = text.split('\n');
  
  const timePatterns = [
    /^(\d{4}-\d{2}-\d{2}\s+\d{1,2}:\d{2}:\d{2})\s+(.+?)(?:\s*$)/,
    /^(\d{4}-\d{2}-\d{2}\s+\d{1,2}:\d{2}:\d{2})\s+(.+?):\s*(.*)/,
    /^(\d{2,4}\/\d{1,2}\/\d{2,4}\s+\d{1,2}:\d{2}:\d{2})\s+(.+?)(?:\s*$)/,
    /^(\d{4}\/\d{2}\/\d{2}\s+\d{1,2}:\d{2}:\d{2})\s+(.+?)(?:\s*$)/,
    /^(\d{4}\/\d{2}\/\d{2}\s+\d{1,2}:\d{2})\s+(.+)$/,
  ];
  
  let current = null;
  
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    
    let matched = false;
    for (const pat of timePatterns) {
      const m = trimmed.match(pat);
      if (m) {
        if (current) allMessages.push(current);
        let sender = m[2].trim();
        let content = m[3] ? m[3].trim() : '';
        
        if (!content && sender.includes('：')) {
          const idx = sender.indexOf('：');
          content = sender.substring(idx + 1).trim();
          sender = sender.substring(0, idx).trim();
        } else if (!content && sender.includes(':')) {
          const idx = sender.indexOf(':');
          content = sender.substring(idx + 1).trim();
          sender = sender.substring(0, idx).trim();
        }
        
        sender = sender.replace(/[：:]$/, '').trim();
        
        current = { time: parseTime(m[1]), sender, content: content || '' };
        matched = true;
        break;
      }
    }
    
    if (!matched && current) {
      current.content += (current.content ? '\n' : '') + trimmed;
    }
  }
  if (current && current.sender) allMessages.push(current);
  
  allMessages = allMessages.filter(m => m.sender && m.sender.length > 0 && m.sender.length < 50);
  
  if (allMessages.length === 0) {
    alert('未能识别聊天记录格式。请确认文件是微信导出的txt格式。\n常见格式：\n2024-01-15 14:30:25 张三\n消息内容');
    location.reload();
    return;
  }
  
  renderAll();
}

function parseTime(str) {
  let d = new Date(str.replace(/\//g, '-'));
  if (!isNaN(d.getTime())) return d;
  const m2 = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m2) {
    const year = m2[3].length === 2 ? '20' + m2[3] : m2[3];
    return new Date(`${year}-${m2[1].padStart(2,'0')}-${m2[2].padStart(2,'0')}T${m2[4].padStart(2,'0')}:${m2[5].padStart(2,'0')}:${(m2[6]||'00').padStart(2,'0')}`);
  }
  return new Date();
}

// ==================== STOP WORDS ====================
const STOP_WORDS = new Set([
  // WeChat internal data noise
  'type','title','des','action','url','showtype','username','nickname','displayname','alias',
  'memberlist','membercount','chatroom','chatroomname','msgtype','fromuser','touser','content',
  'createtime','start','end','msgid','newmsgid','newmsg','localid','seq','status','data',
  'item','items','list','key','value','name','id','id2','info','code','ver','xml','json',
  'source','target','state','flag','size','count','total','page','index','lang','ext','version',
  // Common English noise
  'the','and','for','with','this','that','from','have','are','not','but','you','all','can','has',
  'was','one','our','out','day','use','its','his','her','she','him','them','they','will','just',
  'about','what','when','like','your','how','than','then','also','into','more','some','over',
  'only','other','been','such','each','very','which','their','there','would','could','should',
  'http','https','com','www','html','php','html','net','org','jpg','png','svg','mp3','mp4',
  // Chinese common noise
  '一个','这个','那个','什么','怎么','为什么','没有','可以','就是','还是','因为','所以',
  '如果','已经','但是','不过','然后','可能','应该','需要','知道','觉得','还是','现在',
  '不是','一下','一些','一样','有点','真的','还是','比较','开始','之前','之后','起来',
  '时候','时间','地方','问题','方法','东西','事情','还是','今天','明天','昨天','现在',
  '我们','他们','你们','自己','别人','大家','她们','他的','她的','你的','我的',
  '了吗','什么','怎么','干嘛','哪呢','那呢','么么','是啊','好的',
  // Common number + noise patterns
  'group','user','msg','app','set','get','api','cdn','img',
  // More WeChat internal
  'appmsg','appid','sdkver','view','scene','tousername','fromusername','encrypt',
  'aeskey','ticket','pass','ticket','token','nonce','sign','xml','mmlisten','voip',
  'cdnurl','thumburl','mid','mids','cmdbuffer','buffer','length','offset','limit',
])
const POSITIVE_WORDS = new Set([
  '哈哈','哈哈哈','嘿嘿','嘻嘻','开心','高兴','快乐','幸福','爽','棒','好','太好了','真好','不错','赞','厉害','牛','牛逼','优秀','完美','喜欢','爱','可爱','好看','漂亮','帅','谢谢','感谢','感恩','感动','温暖','舒服','期待','希望','加油','冲','嗨','耶','哇','嗯嗯','好的','OK','ok','👍','nice','great','good','awesome'
]);

const NEGATIVE_WORDS = new Set([
  '唉','哎','烦','讨厌','恶心','气','生气','愤怒','难过','伤心','哭','崩溃','累','疲惫','无聊','差','烂','糟糕','垃圾','傻逼','sb','无语','呵呵','不想','不行','不能','没有','没办法','太难了','不舒服','焦虑','紧张','害怕','担心','后悔','失望','绝望','疼','痛','死了','醉了','算了','随便','MD','tm'
]);

function analyzeSentiment(text) {
  const cleaned = text.replace(/\[[^\]]+\]/g, '').toLowerCase();
  let posCount = 0, negCount = 0;
  
  for (const w of POSITIVE_WORDS) {
    const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    const matches = cleaned.match(re);
    if (matches) posCount += matches.length;
  }
  for (const w of NEGATIVE_WORDS) {
    const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    const matches = cleaned.match(re);
    if (matches) negCount += matches.length;
  }
  
  const total = posCount + negCount;
  if (total === 0) return { label: '中性', score: 0, type: 'neutral' };
  const score = (posCount - negCount) / (posCount + negCount);
  if (score > 0.1) return { label: '积极', score, type: 'positive' };
  if (score < -0.1) return { label: '消极', score, type: 'negative' };
  return { label: '中性', score: 0, type: 'neutral' };
}

// ==================== STATS ====================
function getStats() {
  const senders = {};
  const daily = {};
  const hourly = new Array(24).fill(0);
  const weekly = new Array(7).fill(0);
  const words = {};
  const emojis = {};
  const sentiment = { positive: 0, neutral: 0, negative: 0 };
  const personSentiment = {};
  let imgCount = 0;
  
  for (const m of allMessages) {
    if (!senders[m.sender]) senders[m.sender] = { count:0, totalLen:0, first:null, last:null, images:0 };
    if (!personSentiment[m.sender]) personSentiment[m.sender] = { pos:0, neu:0, neg:0, scores:[] };
    
    senders[m.sender].count++;
    senders[m.sender].totalLen += m.content.length;
    const t = m.time;
    if (!senders[m.sender].first || t < senders[m.sender].first) senders[m.sender].first = t;
    if (!senders[m.sender].last || t > senders[m.sender].last) senders[m.sender].last = t;
    
    const day = toDateStr(t);
    daily[day] = (daily[day] || 0) + 1;
    hourly[t.getHours()]++;
    weekly[t.getDay()]++;
    
    if (/\[图片\]|\[照片\]|\[文件\]|\[视频\]|\[语音\]|<img|\[Image\]|\[Photo\]|\[File\]|\[Video\]/i.test(m.content)) {
      senders[m.sender].images++;
      imgCount++;
    }
    
    // Sentiment
    const s = analyzeSentiment(m.content);
    sentiment[s.type]++;
    personSentiment[m.sender][s.type]++;
    personSentiment[m.sender].scores.push(s.score);
    
    // Word frequency
    const text = m.content.replace(/\[[^\]]+\]/g, '').trim();
    if (text) {
      const cleaned = text.replace(/[^\u4e00-\u9fff\w]/g, '');
      for (let i = 0; i < cleaned.length - 1; i++) {
        const bigram = cleaned.substring(i, i+2);
        if (/[\u4e00-\u9fff]{2}/.test(bigram) && !STOP_WORDS.has(bigram.toLowerCase())) {
          words[bigram] = (words[bigram] || 0) + 1;
        }
      }
      const engWords = text.match(/[a-zA-Z]{2,}/g);
      if (engWords) {
        for (const w of engWords) {
          const lw = w.toLowerCase();
          if (!STOP_WORDS.has(lw)) {
            words[lw] = (words[lw] || 0) + 1;
          }
        }
      }
    }
    
    const emojiMatches = text.match(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu);
    if (emojiMatches) {
      for (const e of emojiMatches) emojis[e] = (emojis[e] || 0) + 1;
    }
  }
  
  return { senders, daily, hourly, weekly, words, emojis, imgCount, sentiment, personSentiment };
}

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

// ==================== WORD CLOUD ====================
function drawWordCloud(stats) {
  const canvas = document.getElementById('wordCloud');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = 600, H = 400;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  
  const sorted = Object.entries(stats.words).sort((a,b) => b[1] - a[1]).slice(0, 80);
  if (sorted.length === 0) return;
  
  const maxCount = sorted[0][1];
  const minCount = sorted[sorted.length - 1][1];
  const colors = ['#07c160','#06ae56','#576b95','#f5a623','#e74c3c','#1abc9c','#9b59b6','#3498db','#2ecc71','#e91e63'];
  
  const placed = [];
  
  function overlaps(x, y, w, h, pad) {
    for (const r of placed) {
      if (x + w + pad > r.x - pad && x - pad < r.x + r.w + pad &&
          y + h + pad > r.y - pad && y - pad < r.y + r.h + pad) return true;
    }
    return false;
  }
  
  for (const [word, count] of sorted) {
    const ratio = (count - minCount) / (maxCount - minCount || 1);
    const fontSize = 12 + ratio * 44;
    ctx.font = `bold ${fontSize}px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif`;
    const metrics = ctx.measureText(word);
    const tw = metrics.width;
    const th = fontSize * 1.2;
    
    let placed_ok = false;
    for (let r = 0; r < Math.max(W, H) * 2 && !placed_ok; r += 2) {
      for (let angle = 0; angle < Math.PI * 2 && !placed_ok; angle += 0.3) {
        const cx = W / 2 + r * Math.cos(angle) * (W / H);
        const cy = H / 2 + r * Math.sin(angle);
        const x = cx - tw / 2;
        const y = cy - th / 2;
        if (x > 10 && y > 10 && x + tw < W - 10 && y + th < H - 10 && !overlaps(x, y, tw, th, 2)) {
          ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
          ctx.fillText(word, x, y + th * 0.8);
          placed.push({ x, y, w: tw, h: th });
          placed_ok = true;
        }
      }
    }
  }
}

function renderPersonality(stats) {
  const senders = Object.keys(stats.senders).sort((a,b) => stats.senders[b].count - stats.senders[a].count);
  
  const html = senders.slice(0, 6).map(s => {
    const d = stats.senders[s];
    const ps = stats.personSentiment[s];
    const avgLen = Math.round(d.totalLen / d.count);
    const emojiCount = d.count; // rough
    const avgScore = ps.scores.length ? (ps.scores.reduce((a,b)=>a+b,0)/ps.scores.length).toFixed(2) : '0';
    
    // Detect personality traits
    const traits = [];
    const dailyActive = d.count / Math.max(Object.keys(stats.daily).length, 1);
    
    if (d.count > 100 && dailyActive > 3) traits.push({c:'active',t:'💬 话多活跃'});
    if (avgLen > 20) traits.push({c:'thought',t:'🧠 表达丰富'});
    else if (avgLen < 8 && d.count > 30) traits.push({c:'direct',t:'✂️ 简洁明了'});
    if (parseFloat(avgScore) > 0.3) traits.push({c:'warm',t:'❤️ 暖心积极'});
    if (parseFloat(avgScore) < -0.2) traits.push({c:'direct',t:'😤 情绪外露'});
    
    // Night owl or early bird
    const allTimes = allMessages.filter(m => m.sender === s).map(m => m.time.getHours());
    const nightCount = allTimes.filter(h => h >= 22 || h <= 5).length;
    const morningCount = allTimes.filter(h => h >= 6 && h <= 9).length;
    if (nightCount > morningCount * 1.5 && nightCount > 10) traits.push({c:'night',t:'🌙 夜猫子'});
    if (morningCount > nightCount * 1.5 && morningCount > 10) traits.push({c:'active',t:'☀️ 早起鸟'});
    
    // Active hours
    const hourBins = new Array(24).fill(0);
    allTimes.forEach(h => hourBins[h]++);
    const peak = hourBins.indexOf(Math.max(...hourBins));
    
    if (traits.length === 0) traits.push({c:'thought',t:'📝 中规中矩'});
    
    return `<div class="person-card">
      <div class="p-name">${s}</div>
      <div class="p-metrics">
        <div class="p-metric">消息数<span class="mv">${d.count}</span></div>
        <div class="p-metric">均长<span class="mv">${avgLen}字</span></div>
        <div class="p-metric">情感分<span class="mv">${avgScore}</span></div>
        <div class="p-metric">活跃峰<span class="mv">${peak}:00</span></div>
      </div>
      <div class="person-tags">
        ${traits.map(t => `<span class="person-tag ${t.c}">${t.t}</span>`).join('')}
      </div>
    </div>`;
  }).join('');
  
  document.getElementById('personalityGrid').innerHTML = html || '<span style="color:#ccc;">需要至少一条消息</span>';
}

// ==================== SENTIMENT TREND ====================
function renderSentimentTrend(stats) {
  const days = Object.keys(stats.daily).sort();
  if (days.length < 2) return;
  
  // Calculate daily sentiment score
  const dailyScores = {};
  for (const m of allMessages) {
    const day = toDateStr(m.time);
    if (!dailyScores[day]) dailyScores[day] = { pos:0, neg:0, total:0 };
    const s = analyzeSentiment(m.content);
    if (s.type === 'positive') dailyScores[day].pos++;
    else if (s.type === 'negative') dailyScores[day].neg++;
    dailyScores[day].total++;
  }
  
  const scores = days.map(d => {
    const ds = dailyScores[d] || { pos:0, neg:0, total:1 };
    return ((ds.pos - ds.neg) / ds.total).toFixed(2);
  });
  
  destroyChart('sentimentTrend');
  const ctx = document.getElementById('sentimentTrend').getContext('2d');
  
  // Rolling average for smoother line
  const smooth = [];
  const window = Math.max(3, Math.floor(days.length / 20));
  for (let i = 0; i < scores.length; i++) {
    let sum = 0, cnt = 0;
    for (let j = Math.max(0, i - window); j <= Math.min(scores.length - 1, i + window); j++) {
      sum += parseFloat(scores[j]); cnt++;
    }
    smooth.push((sum / cnt).toFixed(2));
  }
  
  charts.sentimentTrend = new Chart(ctx, {
    type: 'line',
    data: {
      labels: days,
      datasets: [{
        label: '情感趋势',
        data: smooth,
        borderColor: '#e91e63',
        backgroundColor: 'rgba(233,30,99,0.05)',
        fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => `情感分: ${ctx.parsed.y}` } }
      },
      scales: {
        x: { ticks: { maxTicksLimit: 15, font: { size: 9 } }, grid: { display: false } },
        y: { min: -1, max: 1, grid: { color: '#f0f0f0' },
          ticks: { callback: v => v > 0 ? '😊' : v < 0 ? '😞' : '😐', font: { size: 14 } } }
      }
    }
  });
  document.getElementById('sentimentTrend').parentElement.style.height = '320px';
}

function renderRelationship(stats) {
  const senders = Object.keys(stats.senders).sort((a,b) => stats.senders[b].count - stats.senders[a].count);
  const total = allMessages.length;
  
  if (senders.length < 2) {
    document.getElementById('relationshipAnalysis').innerHTML = '<span style="color:#ccc;">单人聊天，无关系分析</span>';
    return;
  }
  
  // Top 2 people
  const p1 = senders[0], p2 = senders[1];
  const c1 = stats.senders[p1].count, c2 = stats.senders[p2].count;
  const pct1 = ((c1 / total) * 100).toFixed(0), pct2 = ((c2 / total) * 100).toFixed(0);
  
  // Who is more active
  const active = c1 > c2 ? p1 : p2;
  const activeRatio = Math.max(c1, c2) / Math.min(c1, c2);
  
  // Reply pattern: count back-and-forth exchanges
  let exchanges = 0, lastSender = '';
  for (const m of allMessages) {
    if (m.sender !== lastSender && (m.sender === p1 || m.sender === p2) && (lastSender === p1 || lastSender === p2)) {
      exchanges++;
    }
    lastSender = m.sender;
  }
  
  // Avg word per sender
  const avg1 = Math.round(stats.senders[p1].totalLen / c1);
  const avg2 = Math.round(stats.senders[p2].totalLen / c2);
  
  // Interaction intensity
  const chatDays = Object.keys(stats.daily).length;
  const intensity = Math.round((c1 + c2) / Math.max(chatDays, 1));
  
  const html = `
    <div class="rel-metrics">
      <div class="rel-card">
        <div class="r-label">🔥 互动热度</div>
        <div class="r-value">${intensity}</div>
        <div class="r-sub">条/天</div>
      </div>
      <div class="rel-card">
        <div class="r-label">🔁 对话轮次</div>
        <div class="r-value">${exchanges}</div>
        <div class="r-sub">次</div>
      </div>
      <div class="rel-card">
        <div class="r-label">💪 更主动方</div>
        <div class="r-value">${active}</div>
        <div class="r-sub">${activeRatio.toFixed(1)}x</div>
      </div>
      <div class="rel-card">
        <div class="r-label">📝 表达风格</div>
        <div class="r-value">${avg1 > avg2 ? '长篇' : '短快'}</div>
        <div class="r-sub">均${avg1}vs${avg2}字</div>
      </div>
    </div>
    <div class="rel-bar">
      <span class="rel-bar-label">${p1}</span>
      <div class="rel-bar-track">
        <div class="rel-bar-fill" style="width:${pct1}%;background:#07c160;"></div>
        <div class="rel-bar-fill" style="width:${pct2}%;background:#576b95;"></div>
      </div>
      <span class="rel-bar-value">${pct1}%</span>
    </div>
    <div class="rel-bar">
      <span class="rel-bar-label">${p2}</span>
      <div class="rel-bar-track">
        <div class="rel-bar-fill" style="width:${pct2}%;background:#576b95;"></div>
      </div>
      <span class="rel-bar-value">${pct2}%</span>
    </div>
  `;
  document.getElementById('relationshipAnalysis').innerHTML = html;
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== EXPORT REPORT ====================
function exportReport() {
  if (!globalStats) return;
  const stats = globalStats;
  const senders = Object.keys(stats.senders).sort((a,b) => stats.senders[b].count - stats.senders[a].count);
  const days = Object.keys(stats.daily).sort();
  const first = days[0] || '-';
  const last = days[days.length-1] || '-';
  const dateSpan = days.length >= 2 ? Math.round((new Date(last) - new Date(first)) / 86400000) + 1 : days.length;
  const total = allMessages.length;
  
  // Capture chart images
  const chartImgs = {};
  const chartIds = ['dailyChart','personChart','hourlyChart','weeklyChart'];
  for (const id of chartIds) {
    const c = document.getElementById(id);
    if (c) chartImgs[id] = c.toDataURL('image/png');
  }
  
  // Word cloud
  const wc = document.getElementById('wordCloud');
  const wcImg = wc ? wc.toDataURL('image/png') : '';
  
  // Top words
  const topWords = Object.entries(stats.words).sort((a,b) => b[1]-a[1]).slice(0, 30).map(([w,c]) => `${w}(${c})`).join(', ');
  
  // Person table
  const personRows = senders.map(s => {
    const d = stats.senders[s];
    const ps = stats.personSentiment[s];
    const pct = ((d.count / total) * 100).toFixed(1);
    const avgLen = Math.round(d.totalLen / d.count);
    const avgScore = ps && ps.scores.length > 0 ? (ps.scores.reduce((a,b) => a+b,0)/ps.scores.length).toFixed(2) : '-';
    const first = d.first ? toDateStr(d.first) : '-';
    const last = d.last ? toDateStr(d.last) : '-';
    return `<tr><td>${s}</td><td>${d.count}</td><td>${pct}%</td><td>${avgLen}字</td><td>${avgScore}</td><td>${d.images}</td><td>${first}</td><td>${last}</td></tr>`;
  }).join('');
  
  // Sentiment per person
  const sentPersonRows = senders.map(s => {
    const ps = stats.personSentiment[s];
    const pTotal = ps.pos + ps.neu + ps.neg || 1;
    const avg = ps.scores.length > 0 ? (ps.scores.reduce((a,b)=>a+b,0)/ps.scores.length).toFixed(2) : '0';
    return `<tr><td>${s}</td><td>${ps.pos}</td><td>${ps.neu}</td><td>${ps.neg}</td><td>${avg}</td></tr>`;
  }).join('');
  
  const sTotal = stats.sentiment.positive + stats.sentiment.neutral + stats.sentiment.negative;
  
  const reportHtml = `<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>微信聊天记录分析报告</title>
<style>

.report{max-width:1100px;margin:0 auto;}
.cover{background:linear-gradient(135deg,#07c160,#06ae56);color:#fff;padding:60px 40px;border-radius:16px;text-align:center;margin-bottom:32px;}
.cover h1{font-size:36px;margin-bottom:12px;}
.cover p{opacity:.85;font-size:16px;}
.section{background:#fff;border-radius:12px;padding:32px;margin-bottom:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.section h2{font-size:20px;margin-bottom:20px;color:#07c160;border-bottom:2px solid #f0f0f0;padding-bottom:12px;}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:32px;}
.stat-box{text-align:center;padding:20px;background:#fafafa;border-radius:10px;}
.stat-box .val{font-size:28px;font-weight:700;color:#07c160;}
.stat-box .lbl{font-size:12px;color:#999;margin-top:4px;}

.chart-box h4{font-size:14px;color:#666;margin-bottom:12px;}

th{background:#fafafa;padding:10px 12px;text-align:left;border-bottom:2px solid #eee;font-weight:600;}

  </table>
</div>

  <div class="charts">
    <div class="chart-box"><h4>每日消息趋势</h4><img src="${chartImgs.dailyChart || ''}" alt=""></div>
    <div class="chart-box"><h4>发言分布</h4><img src="${chartImgs.personChart || ''}" alt=""></div>
    <div class="chart-box"><h4>24小时活跃</h4><img src="${chartImgs.hourlyChart || ''}" alt=""></div>
    <div class="chart-box"><h4>每周活跃</h4><img src="${chartImgs.weeklyChart || ''}" alt=""></div>
  </div>
  ${wcImg ? `<div class="chart-box" style="text-align:center;margin-bottom:24px;"><h4 style="margin-bottom:12px;color:#666;">☁️ 高频词云</h4><img src="${wcImg}" alt="" style="max-width:100%;border-radius:8px;"></div>` : ''}
</div>

<div class="section">
  <h2>🔤 高频词汇 TOP30</h2>
  <p style="word-break:break-all;line-height:2;color:#666;">${topWords || '无'}</p>
</div>

<div class="section">
  <h2>👥 成员发言统计</h2>
  <table>
    <tr><th>发言人</th><th>消息数</th><th>占比</th><th>平均长度</th><th>情感评分</th><th>图片/文件</th><th>首条</th><th>末条</th></tr>
    ${personRows}

</div>

<div class="footer">📊 由微信聊天记录分析工具自动生成 | 数据来源：用户上传</div>
</div></body></html>`;
  
  const blob = new Blob([reportHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `微信聊天分析报告_${new Date().toISOString().slice(0,10)}.html`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
